# 客戶管理系統設定
server.port=8000
# 預設只接受本機連線（系統沒有登入機制）；要開放給其他電腦時改為 0.0.0.0
server.address=127.0.0.1

# SQLite 資料庫檔案（相對於執行目錄；在 IntelliJ 中即為專案根目錄）
spring.datasource.url=jdbc:sqlite:crm.db
# SQLite 同一時間只允許一個寫入者，使用單一連線避免鎖定錯誤
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON

# 啟動時建立資料表（已存在則略過）
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# 回應一律使用 UTF-8
server.servlet.encoding.force=true
